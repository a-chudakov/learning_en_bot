name: Deploy to VPS

on:
  push:
    branches:
      - main  # Измени на свою ветку, если нужно
      - master
  workflow_dispatch:  # Позволяет запускать вручную

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
    
    - name: 🔧 Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 📦 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    
    - name: 🧪 Run tests (если есть)
      run: |
        # Если у тебя есть тесты, добавь их здесь
        # pytest
        echo "Тесты пока не настроены"
      continue-on-error: true
    
    - name: 🚀 Deploy to VPS
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        port: ${{ secrets.VPS_PORT || 22 }}
        script: |
          cd ${{ secrets.BOT_DIR || '~/bots/learning_en_bot' }}
          
          # Получаем последние изменения
          git fetch origin
          git reset --hard origin/main  # или origin/master
          
          # Активируем venv (если используешь)
          if [ -d "venv" ]; then
            source venv/bin/activate
          fi
          
          # Обновляем зависимости
          pip install -e . || echo "Ошибка установки зависимостей"
          
          # Перезапускаем бота (если используешь systemd)
          if systemctl is-active --quiet learning-en-bot; then
            sudo systemctl restart learning-en-bot
            echo "✅ Бот перезапущен"
          else
            echo "⚠️  Бот не запущен через systemd"
          fi
          
          # Или альтернативный способ - убить процесс и запустить заново
          # pkill -f "src.learning_en_bot.main" || true
          # nohup python -m src.learning_en_bot.main > bot.log 2>&1 &
    
    - name: ✅ Deployment status
      run: |
        echo "✅ Деплой завершён успешно!"
        echo "Проверь логи на сервере: sudo journalctl -u learning-en-bot -n 50"
